site_name: Demo IS2
site_url: https://262is2.github.io/demo-is2/
repo_url: https://github.com/262is2/demo-is2
repo_name: 262is2/demo-is2
docs_dir: docs

nav:
  - Inicio: index.md
  - Guía de Proyecto Sello:
      - Guía del proyecto: proyecto-sello/index.md
  - Silabos:
      - Silabo 2026-1: silabo_is2_2026_1.md
      - Silabo 2026-2: silabo_is2_2026_2.md
  - 1. Calidad en los Procesos con NTP ISO/IEC 12207 e ISO/IEC 29110:
      - "S1 - NTP ISO/IEC 12207: Modelamiento de Procesos del Ciclo de Vida del Software": sesiones/S01_NTP_ISO_IEC_12207.md
      - "S2 - NTP ISO/IEC 12207: Métricas de Proceso e Instrumentos de Aseguramiento": sesiones/S02_Metricas_Proceso_Instrumentos_Aseguramiento.md

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search
